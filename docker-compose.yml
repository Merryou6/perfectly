services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-perfectly-root}
      MYSQL_DATABASE: perfectly
      MYSQL_USER: perfectly
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-perfectly-pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-perfectly-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
